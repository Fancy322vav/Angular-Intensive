<div>
  <h3>Global counter</h3>
  <div class="counter-display">
    Counter value: <strong>{{ currentCounter }}</strong>
  </div>
  <div class="button-group">
    <button class="btn btn-primary" (click)="increment()">Increment by 1</button>
    <button class="btn btn-secondary" (click)="decrement()">
      Decrement by 1
    </button>
  </div>
</div>
